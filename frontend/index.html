<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="ShopEase online product catalog">

    <title>ShopEase - E-Commerce</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>

    <!-- Skip Navigation -->
    <a href="#main-content" class="skip-link">
        Skip to main content
    </a>


    <!-- Header -->
    <header>

        <nav class="navbar"
             aria-label="Main navigation">

            <h1 class="logo">
                ShopEase
            </h1>

            <ul class="nav-links">

                <li>
                    <a href="#/"
                       aria-label="Go to ShopEase home page">
                        Home
                    </a>
                </li>

                <li>
                    <a href="#/products"
                       aria-label="View ShopEase products">
                        Products
                    </a>
                </li>

                <li>
                    <a href="#/about"
                       aria-label="Learn more about ShopEase">
                        About
                    </a>
                </li>

                <li>
                    <a href="#/cart"
                       aria-label="View shopping cart">
                        Cart
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Main Content -->
    <main id="main-content">


        <!-- Home Section -->
        <section id="home"
                 class="hero"
                 aria-labelledby="home-heading">

            <h2 id="home-heading">
                Discover Products You Love
            </h2>

            <p>
                Quality products at affordable prices.
            </p>

            <button
                type="button"
                onclick="showProducts()"
                aria-label="Shop now and view products">
                Shop Now
            </button>

        </section>


        <!-- Products Section -->
        <section id="products"
                 aria-labelledby="products-heading">

            <h2 id="products-heading">
                Featured Products
            </h2>


            <!-- Search -->
            <div class="search-box">

                <label for="searchInput">
                    Search products
                </label>

                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search products..."
                    aria-label="Search products">

            </div>


            <!-- Products will be inserted by JavaScript -->
            <div id="product-container"
                 class="product-grid"
                 aria-live="polite">
            </div>

        </section>


        <!-- Cart Section -->
        <section id="cart"
                 aria-labelledby="cart-heading">

            <h2 id="cart-heading">
                Your Shopping Cart
            </h2>

            <div id="cart-container"
                 aria-live="polite">
            </div>

        </section>


    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 ShopEase. All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
    <script src="js/router.js"></script>

</body>

</html>
